version: '3.8'

services:
  # Serviço da API Node.js
  api:
    build: .
    container_name: fullstack-api
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - MONGODB_URI=mongodb://mongodb:27017/fullstack-app
      - PORT=5000
    depends_on:
      - mongodb
    networks:
      - app-network
    volumes:
      - ./src:/app/src
      - /app/node_modules

  # Serviço do MongoDB
  mongodb:
    image: mongo:7
    container_name: fullstack-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_DATABASE=fullstack-app
    volumes:
      - mongodb_data:/data/db
      - mongodb_config:/data/configdb
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  mongodb_data:
    driver: local
  mongodb_config:
    driver: local